packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - expo-image@57.0.3

virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 20
