packages:
  - "apps/*"
  - "packages/*"

overrides:
  lightningcss: 1.30.1
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - expo-image@57.0.3
  - '@better-auth/core@1.7.22'
  - '@better-auth/drizzle-adapter@1.7.22'
  - '@better-auth/expo@1.7.22'
  - '@better-auth/kysely-adapter@1.7.22'
  - '@better-auth/memory-adapter@1.7.22'
  - '@better-auth/mongo-adapter@1.7.22'
  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - better-auth@1.7.22

virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 20
